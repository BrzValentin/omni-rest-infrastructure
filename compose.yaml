services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: omni_rest
      POSTGRES_USER: omni_rest
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni_rest -d omni_rest"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - omni-rest-postgres:/var/lib/postgresql

volumes:
  omni-rest-postgres:

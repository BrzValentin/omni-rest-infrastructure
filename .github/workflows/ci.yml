# Continuous integration for omni-rest-infrastructure.
#
# ---------------------------------------------------------------------------------------------------
# THIS WORKFLOW HAS NEVER BEEN EXECUTED.
#
# This repository had no CI of any kind before Phase 8 — no .github/, no pipelines — so nothing here has
# ever run against a real runner. It was authored from the commands the README and package.json already
# document, and validated only as far as YAML parsing and local equivalents allow. Expect the first push
# to need adjustment, and do not treat a green badge as proven until one has actually gone green.
#
# See specifications/phase-8/README.md, Ruling 7.
# ---------------------------------------------------------------------------------------------------
#
# Two environment facts drive the shape below:
#
#   * The backend integration suite provisions PostgreSQL 18 through Testcontainers, so this needs a
#     Docker daemon (present on ubuntu-latest) rather than a `services:` container. Setting
#     OMNI_TEST_POSTGRES would switch it to an external database instead; we deliberately do not, so CI
#     exercises the same path developers run.
#   * That suite calls EnsureDeletedAsync on a shared database and disables parallelisation
#     assembly-wide. Never run two `dotnet test` invocations concurrently against one database.

name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Version comes from global.json, which pins 10.0.302 with rollForward disabled.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        working-directory: src/backend
        run: dotnet restore

      - name: Build
        working-directory: src/backend
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: src/backend
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        working-directory: src/frontend
        run: npm ci

      - name: Lint
        working-directory: src/frontend
        run: npm run lint

      - name: Typecheck
        working-directory: src/frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: src/frontend
        run: npm run test

      - name: Build
        working-directory: src/frontend
        run: npm run build

      # Asserts no design markup reaches any client chunk — the regression that Phase 8's largest
      # performance fix would silently undo. Needs the production build above.
      - name: Design asset isolation
        working-directory: src/frontend
        run: npm run test:design-assets

  e2e:
    name: End-to-end and performance gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        working-directory: src/frontend
        run: npm ci

      # `--with-deps` is what makes this runnable here and not on a developer's WSL2 box, where the
      # browser's system packages need password sudo.
      - name: Install Playwright browsers
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Build
        working-directory: src/frontend
        run: npm run build

      # playwright.config.ts chains three web servers: the API (docker compose + migrations + seed),
      # the fixture proxy, and `next start`.
      - name: End-to-end tests
        working-directory: src/frontend
        run: npm run test:e2e

      # Runs the @perf spec, then scripts/perf-report.mjs, which EXITS NON-ZERO when a budget in
      # specifications/phase-8/performance-budget.md is exceeded. This is the PR-23 Task 15 gate.
      - name: Performance budget gate
        working-directory: src/frontend
        run: npm run test:perf

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-performance
          path: src/frontend/test-results/frontend-performance.json
          if-no-files-found: ignore

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report
          if-no-files-found: ignore
